<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Preview | EBG LTD</title>
  <link rel="icon" type="image/jpeg" href="images/EBG LTD Global Tech Control Logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main style="padding: 40px 20px;">
    <section class="certificate-card" style="max-width: 900px; margin: 0 auto;">
      <div class="certificate-preview" id="dynamicCertificatePreview">
        <embed src="images/Copy of Copy of NEXXXAA Certificate MASTER ORIGINAL update.pdf" type="application/pdf" width="100%" height="600px" alt="EBG LTD Certificate">
      </div>
      <div class="qr-wrapper" id="certificateQrCodePlaceholder"></div>
    </section>
  </main>
  <script src="js/demo-data.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script>
    const data = JSON.parse(localStorage.getItem('ebgDemoData') || 'null') || demoData;
    const certificate = data.certificates[0];
    const student = data.users.find((u) => u.id === certificate.studentId);
    const course = data.courses.find((c) => c.id === certificate.courseId);
    const qrContainer = document.getElementById('certificateQrCodePlaceholder');

    const verificationUrl = `${window.location.origin}/verify-certificate.html?certificate=${encodeURIComponent(certificate.verificationCode)}`;
    const qrPayload = JSON.stringify({
      certificate_id: certificate.certificateId,
      verification_code: certificate.verificationCode,
      student: student.fullName,
      course: course.title,
      issuedDate: certificate.issuedDate,
      status: certificate.status,
      verification_url: verificationUrl
    });

    if (window.QRCode && qrContainer) {
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: qrPayload,
        width: 220,
        height: 220,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }
  </script>
</body>
</html>
