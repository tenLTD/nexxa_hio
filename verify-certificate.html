<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Certificate | EBG LTD</title>
  <link rel="icon" type="image/jpeg" href="images/EBG LTD Global Tech Control Logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <main style="padding: 40px 20px;">
    <section class="certificate-card" style="max-width: 700px; margin: 0 auto;">
      <h2>Certificate Verification</h2>
      <p>Enter a certificate ID or verification code.</p>
      <form class="certificate-verify-form">
        <input type="text" placeholder="EBG-2026-00001" required>
        <button class="btn btn-primary" type="submit">Verify</button>
      </form>
      <div class="certificate-result"></div>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script src="js/components.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/qrcode.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
